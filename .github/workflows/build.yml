      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk AppLock.apk

      - name: Save APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-apk
          path: AppLock.apk

      - name: Publish APK (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: App Lock build ${{ github.run_number }}
          files: AppLock.apk
